name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compiler tous les plugins
        run: |
          mkdir -p out
          for POM in $(find . -name pom.xml -not -path './.git/*'); do
            DIR=$(dirname "$POM")
            (cd "$DIR" && mvn -B -q package)
            cp "$DIR"/target/*.jar out/
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Plugins
          path: out/*.jar
